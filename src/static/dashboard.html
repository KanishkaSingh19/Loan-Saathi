<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Saathi Live</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #c2410c; --good: #15803d; --good-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe; --flash: #fff7ed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1f1f1d; --text: #ecebe7; --muted: #a09e98; --line: #34332f;
      --accent: #fb923c; --good: #4ade80; --good-bg: #14361f; --warn: #facc15; --warn-bg: #3a300c;
      --bad: #f87171; --bad-bg: #3d1515; --info: #93c5fd; --info-bg: #172a4d; --flash: #2a2118;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; display: flex;
           flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .live { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 18px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .toolbar span { color: var(--muted); font-size: 13px; margin-right: 4px; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button:hover { border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
          margin-bottom: 12px; transition: background 2s; }
  .card.new { background: var(--flash); }
  .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .badge { font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .pre_approved { color: var(--good); background: var(--good-bg); }
  .counter_offer, .needs_review { color: var(--warn); background: var(--warn-bg); }
  .not_eligible_now { color: var(--bad); background: var(--bad-bg); }
  .need_more_info { color: var(--info); background: var(--info-bg); }
  .meta { color: var(--muted); font-size: 13px; }
  .offer { font-size: 18px; font-weight: 600; margin: 8px 0 2px; }
  .meter { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
  .bar { position: relative; flex: 1; max-width: 320px; height: 8px; border-radius: 4px;
         /* bar spans 0–30% risk; zones match the 5% / 12% band cut-offs */
         background: linear-gradient(90deg, var(--good) 0 16.7%, var(--warn) 16.7% 40%, var(--bad) 40% 100%); opacity: .85; }
  .bar i { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 12px; }
  h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 3px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); width: 45%; padding-right: 8px; }
  ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .up li::marker { content: "▲  "; color: var(--bad); }
  .down li::marker { content: "▼  "; color: var(--good); }
  .hint { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg);
          border-radius: 0 8px 8px 0; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  .keybox { max-width: 420px; margin: 60px auto; background: var(--card); border: 1px solid var(--line);
            border-radius: 14px; padding: 20px; }
  .keybox input { width: 100%; font: inherit; padding: 8px 10px; margin: 10px 0; border-radius: 8px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Loan <span>Saathi</span> · live pre-screens</h1>
  <div class="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
</header>
<main id="app"></main>

<script>
const DECISIONS = {
  pre_approved: "Pre-approved", counter_offer: "Safer counter-offer", needs_review: "Officer review",
  not_eligible_now: "Not eligible now", need_more_info: "Needs more info",
};
const SAID_LABELS = {
  loan_amount: "Loan amount", tenure_months: "Repay in", monthly_income: "Monthly income", work: "Work",
  years_in_work: "Years in work", age: "Age", other_loans_count: "Other loans", other_loans_outstanding: "Still owed",
  other_loans_emi: "Existing EMI", housing: "Housing", family_members: "Family size", children: "Children",
  education: "Education", owns_vehicle: "Owns vehicle",
};
const SAMPLES = {
  "Kirana owner": { monthly_income: "30 hazaar", loan_amount: "50,000", tenure_months: "1 saal", age: "45",
    work: "kirana ki dukaan", years_in_work: "15 saal", education: "10th pass", housing: "apna ghar",
    family_members: "5", children: "3", owns_vehicle: "haan", other_loans_count: "0" },
  "Asks too much": { monthly_income: "25 hazaar", loan_amount: "3 lakh", tenure_months: "2 saal", age: "34",
    work: "private company me sales", years_in_work: "6 saal", education: "graduate", housing: "kiraye ka ghar",
    family_members: "4", children: "2", owns_vehicle: "nahi", other_loans_count: "1",
    other_loans_outstanding: "40 hazaar", other_loans_emi: "2000" },
  "Heavy debt": { monthly_income: "15000", loan_amount: "2 lakh", tenure_months: "2 saal", age: "22",
    work: "construction mazdoor", years_in_work: "6 mahine", education: "8th", housing: "rent",
    family_members: "1", children: "0", owns_vehicle: "no", other_loans_count: "3", other_loans_outstanding: "1.5 lakh" },
};

// The model's category names come from the (non-Indian) dataset; show plainer words.
const FRIENDLY = {
  "Commercial associate": "Self-employed / business", "State servant": "Government job",
  "Working": "Salaried / wage work", "Pensioner": "Retired / pension", "Businessman": "Business owner",
  "House / apartment": "Own house", "Rented apartment": "Rented", "Office apartment": "Company quarters",
  "Municipal apartment": "Government housing", "Secondary / secondary special": "School (10th/12th)",
  "Higher education": "College degree", "Lower secondary": "Below 10th", "Incomplete higher": "College, not finished",
  "Laborers": "Labourer", "Low-skill Laborers": "Helper",
};
const friendly = s => String(s).replace(
  new RegExp(Object.keys(FRIENDLY).map(k => k.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&")).join("|"), "g"),
  m => FRIENDLY[m]);

let key = "";
try { key = sessionStorage.getItem("saathi_key") || ""; } catch (e) {}
const seen = new Set();
let first = true;
let locked = !key;
const app = document.getElementById("app");

// Build DOM with textContent only: everything shown comes from callers.
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k) n.append(k);
  return n;
}

function askKey(msg) {
  locked = true;
  app.replaceChildren(el("div", { class: "keybox" },
    el("h3", { text: "Webhook key" }),
    el("div", { class: "meta", text: msg || "Paste the WEBHOOK_KEY from your .env file. It stays in this browser tab only." }),
    el("input", { id: "k", type: "password", autocomplete: "off" }),
    el("button", { id: "go", text: "Open dashboard" })));
  document.getElementById("go").onclick = () => {
    key = document.getElementById("k").value.trim();
    try { sessionStorage.setItem("saathi_key", key); } catch (e) {}
    locked = false; first = true; seen.clear(); refresh();
  };
}

function shell() {
  if (document.getElementById("list")) return;
  const tiles = el("div", { class: "tiles", id: "tiles" });
  const bar = el("div", { class: "toolbar" }, el("span", { text: "Send a test caller:" }));
  for (const name of Object.keys(SAMPLES)) {
    const b = el("button", { text: name });
    b.onclick = () => send(SAMPLES[name]);
    bar.append(b);
  }
  app.replaceChildren(tiles, bar, el("div", { id: "list" }));
}

function tile(n, label) { return el("div", { class: "tile" }, el("b", { text: String(n) }), el("small", { text: label })); }

function card(p) {
  const r = p.result, d = r.details || {};
  const when = new Date(p.ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const c = el("div", { class: "card" });
  c.append(el("div", { class: "top" },
    el("span", { class: "badge " + r.decision, text: DECISIONS[r.decision] || r.decision }),
    el("span", { class: "meta", text: `${when} · #${p.id}` })));

  if (r.offer_amount) {
    c.append(el("div", { class: "offer",
      text: `${r.offer_amount_text} over ${r.tenure_months} months · EMI ${r.offer_emi_text}/month` }));
  }
  if (r.risk_percent) {
    const pct = parseFloat(r.risk_percent);
    const pos = Math.min(pct / 30, 1) * 100;
    const marker = el("i"); marker.style.left = `calc(${pos}% - 2px)`;
    c.append(el("div", { class: "meter" },
      el("span", { text: `Repayment risk ${pct.toFixed(1)}% (${r.risk_band})` }), el("div", { class: "bar" }, marker)));
  }

  const said = el("table");
  for (const [k, label] of Object.entries(SAID_LABELS)) {
    const v = p.said[k];
    if (v === undefined || v === null || v === "" || String(v).includes("{{")) continue;
    said.append(el("tr", {}, el("td", { text: label }), el("td", { text: String(v) })));
  }
  const grid = el("div", { class: "grid" }, el("div", {}, el("h3", { text: "What the caller said" }), said));

  const why = el("div", {});
  const ups = (d.raises_risk || []), downs = (d.lowers_risk || []);
  const line = i => el("li", { text: friendly(`${i.label}: ${i.value} (typical ${i.typical})`) });
  if (ups.length) why.append(el("h3", { text: "Raises risk" }), el("ul", { class: "up" }, ...ups.map(line)));
  if (downs.length) why.append(el("h3", { text: "Lowers risk" }), el("ul", { class: "down" }, ...downs.map(line)));
  if (r.missing_fields) why.append(el("h3", { text: "Missing" }), el("div", { text: r.missing_fields }));
  grid.append(why);
  c.append(grid);

  c.append(el("div", { class: "hint" }, el("b", { text: "Agent told to say: " }), document.createTextNode(r.reply_hint)));

  const understood = el("pre", { text: JSON.stringify(p.applicant, null, 2) });
  c.append(el("details", {}, el("summary", { text: "How the model understood it" }), understood));
  if (d.all_factors) {
    const t = el("table");
    for (const f of d.all_factors) {
      t.append(el("tr", {}, el("td", { text: f.label }),
        el("td", { text: friendly(`${f.value} → ${(f.impact >= 0 ? "+" : "") + (f.impact * 100).toFixed(1)} pts`) })));
    }
    c.append(el("details", {}, el("summary", { text: "All model factors (including ones the agent doesn't speak)" }), t));
  }
  return c;
}

function callCard(call) {
  const when = new Date(call.ts * 1000).toLocaleTimeString();
  return el("div", { class: "card" },
    el("div", { class: "top" }, el("span", { class: "badge need_more_info", text: "Call ended" }),
      el("span", { class: "meta", text: `${when} · #${call.id}` })),
    el("details", {}, el("summary", { text: "Post-call data from Gnani" }),
      el("pre", { text: JSON.stringify(call.payload, null, 2) })));
}

async function send(body) {
  await fetch("v1/prescreen", { method: "POST", headers: { "Content-Type": "application/json", "X-Webhook-Key": key },
    body: JSON.stringify(body) });
  refresh();
}

async function refresh() {
  const dot = document.getElementById("dot"), status = document.getElementById("status");
  try {
    const res = await fetch("v1/applications?limit=50", { headers: { "X-Webhook-Key": key } });
    if (res.status === 401) { dot.className = "dot"; status.textContent = "locked"; askKey(key ? "That key didn't work. Try again." : ""); return; }
    const data = await res.json();
    shell();
    const ps = data.prescreens, count = d => ps.filter(p => p.result.decision === d).length;
    document.getElementById("tiles").replaceChildren(
      tile(ps.length, "pre-screens"), tile(count("pre_approved"), "pre-approved"),
      tile(count("counter_offer") + count("needs_review"), "counter-offer / review"),
      tile(count("not_eligible_now"), "not eligible now"), tile(data.calls.length, "calls logged"));

    const items = [...ps.map(p => ({ ts: p.ts, id: p.id, node: () => card(p) })),
                   ...data.calls.map(c => ({ ts: c.ts, id: "c" + c.id, node: () => callCard(c) }))]
      .sort((a, b) => b.ts - a.ts);
    const list = document.getElementById("list");
    if (!items.length) {
      list.replaceChildren(el("div", { class: "empty", text: "Waiting for the first caller… or send a test caller above." }));
    } else {
      const nodes = items.map(it => {
        const n = it.node();
        if (!first && !seen.has(it.id)) { n.classList.add("new"); setTimeout(() => n.classList.remove("new"), 4000); }
        seen.add(it.id);
        return n;
      });
      // Keep open <details> stable by only re-rendering when something changed.
      const sig = items.map(i => i.id).join(",");
      if (list.dataset.sig !== sig) { list.replaceChildren(...nodes); list.dataset.sig = sig; }
    }
    first = false;
    dot.className = "dot on";
    status.textContent = "live · updated " + new Date().toLocaleTimeString();
  } catch (e) {
    dot.className = "dot"; status.textContent = "server unreachable, retrying…";
  }
}

refresh();
setInterval(() => { if (!locked) refresh(); }, 3000);
</script>
</body>
</html>
