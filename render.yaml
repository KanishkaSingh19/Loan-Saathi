# Render Blueprint: one free web service runs the API, the dashboard and live voice (Dockerfile).
# Render → New → Blueprint → this repository. Secrets marked sync: false are typed in by you on Render;
# WEBHOOK_KEY is generated by Render (copy it from the service's Environment tab to sign in).
services:
  - type: web
    name: loan-saathi
    runtime: docker
    plan: free
    region: singapore          # closest free region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WEBHOOK_KEY
        generateValue: true
      - key: GNANI_STT_API_KEY
        sync: false
      - key: GNANI_TTS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL       # Neon Postgres; leave empty to use SQLite (wiped on every restart)
        sync: false
      - key: ADVISOR_WEBHOOK_URL
        sync: false
      - key: RETENTION_DAYS
        value: "30"
