# Render Blueprint: a free web service runs the API, the dashboard at /dashboard/ and live voice (Dockerfile);
# a free static site serves the same dashboard from a CDN so the first load is fast.
# Render → New → Blueprint → this repository. Secrets marked sync: false are typed in by you on Render;
# WEBHOOK_KEY is generated by Render (copy it from the service's Environment tab to sign in).
services:
  - type: web
    name: loan-saathi
    runtime: docker
    plan: free
    region: singapore          # closest free region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WEBHOOK_KEY
        generateValue: true
      - key: GNANI_STT_API_KEY
        sync: false
      - key: GNANI_TTS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL         # tried in order; each model has its own free-tier rate limit
        value: qwen/qwen3.8-27b,openai/gpt-oss-20b
      - key: LLM_DEADLINE_S
        value: "3"
      - key: DATABASE_URL       # Neon Postgres; leave empty to use SQLite (wiped on every restart)
        sync: false
      - key: ADVISOR_WEBHOOK_URL
        sync: false
      - key: RETENTION_DAYS
        value: "30"
      - key: ALLOWED_ORIGINS    # the static dashboard below; comma-separate more (Vercel, Netlify)
        value: https://loan-saathi-web.onrender.com
  # The dashboard as a free static site on Render's CDN: it loads at once, even while the API sleeps,
  # and pings /health on load to wake it. The API above still serves /dashboard/ too.
  - type: web
    name: loan-saathi-web
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: STATIC_SITE
        value: "1"
      - key: VITE_API_BASE      # the API service's URL, no trailing slash
        value: https://loan-saathi.onrender.com
