# Netlify: the dashboard as a static site (Base directory: dashboard). Netlify sets NETLIFY=true, so
# vite.config.js builds for the site root. Set VITE_API_BASE to the API's URL in Site settings.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
